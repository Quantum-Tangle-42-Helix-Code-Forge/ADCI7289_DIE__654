<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finaliser l'achat - Aksess</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --itchio_white_back: #141414;
            --itchio_gray_back: #1f1f1f;
            --itchio_body_color: #e2e2e2;
            --itchio_border_color: #333333;
            --itchio_link_color: #fa5c5c;
        }
        body { 
            background-color: var(--itchio_white_back); 
            color: var(--itchio_body_color); 
            font-family: 'Lato', sans-serif; margin: 0; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
        }
        .checkout-container {
            background: var(--itchio_gray_back);
            border: 1px solid var(--itchio_border_color);
            padding: 30px; border-radius: 4px; width: 90%; max-width: 500px; text-align: center;
        }
        .game-visual {
            width: 100%; height: 250px; border-radius: 4px; margin-bottom: 20px;
            background: #000; display: flex; align-items: center; justify-content: center;
            overflow: hidden; border: 1px solid #444;
        }
        .game-visual img, .game-visual video { width: 100%; height: 100%; object-fit: cover; }
        
        h1 { font-size: 24px; margin-bottom: 10px; color: #fff; }
        .price-id { color: #888; font-size: 12px; margin-bottom: 20px; font-family: monospace; }
        
        .btn-pay {
            background-color: var(--itchio_link_color);
            color: white; border: none; padding: 15px 30px;
            font-size: 18px; font-weight: bold; border-radius: 3px;
            cursor: pointer; width: 100%; transition: opacity 0.2s;
        }
        .btn-pay:disabled { background-color: #555; cursor: not-allowed; }
        .btn-pay:hover:not(:disabled) { opacity: 0.9; }
        
        .status-msg { margin-top: 15px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

    <div class="checkout-container">
        <div id="visual-container" class="game-visual">
            <!-- Image ou Animation chargée dynamiquement -->
            <p>Chargement du visuel...</p>
        </div>

        <h1 id="product-name">Préparation de la commande...</h1>
        <div id="price-display" class="price-id">...</div>

        <button id="btn-proceed" class="btn-pay" disabled>PROCÉDER AU PAIEMENT</button>
        <p id="status-text" class="status-msg">Initialisation sécurisée...</p>
    </div>

    <script type="module">
    import { supabaseClient, PADDLE_ENV, PADDLE_CLIENT_TOKEN } from './js/config.js';
    
    async function initCheckout() {
        // Extraction fraîche et obligatoire des paramètres de l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const currentToken = urlParams.get('checkout_token');
        
        let priceId = urlParams.get('price_id');
        let gameSlug = urlParams.get('game');
        let activeUser = null;

        const btnProceed = document.getElementById('btn-proceed');
        const statusText = document.getElementById('status-text');

        // -------------------------------------------------------------
        // 1. PRIORITÉ ABSOLUE : VALIDATION DU CHECKOUT_TOKEN DE L'APPLI
        // -------------------------------------------------------------
        if (currentToken) {
            statusText.innerText = "Validation de la session d'achat de l'application...";
            console.log("Token détecté :", currentToken);

            try {
                const { data: sessionData, error: sessionError } = await supabaseClient
                    .from('checkout_sessions')
                    .select('*')
                    .eq('token', currentToken)
                    .gt('expires_at', new Date().toISOString())
                    .single();

                if (sessionData && !sessionError) {
                    priceId = sessionData.price_id;
                    gameSlug = sessionData.game_slug;
                    console.log("Session validée pour le jeu :", gameSlug);
                    
                    // Chargement du profil de l'application
                    const { data: userData } = await supabaseClient
                        .from('profiles')
                        .select('*')
                        .eq('id', sessionData.user_id)
                        .single();
                        
                    activeUser = { id: sessionData.user_id, email: sessionData.user_email, ...userData };

                    // Invalidation du token unique
                    await supabaseClient
                        .from('checkout_sessions')
                        .delete()
                        .eq('token', currentToken);
                } else {
                    console.warn("Jeton temporaire expiré, invalide ou déjà consommé.");
                }
            } catch (err) {
                console.error("Erreur lors de la validation du checkout_token :", err);
            }
        }

        // -------------------------------------------------------------
        // 2. CAS DE SECOURS : SESSION DU NAVIGATEUR (Si aucun token)
        // -------------------------------------------------------------
        if (!activeUser) {
            console.log("Aucun token valide trouvé. Lecture de la session du navigateur...");
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) {
                activeUser = user;
            }
        }

        // Bloquant : Si aucun utilisateur n'est trouvé
        if (!activeUser) {
            statusText.innerText = "❌ Connexion requise pour finaliser l'achat.";
            btnProceed.disabled = false;
            btnProceed.innerText = "SE CONNECTER";
            btnProceed.classList.remove('btn-pay');
            
            btnProceed.onclick = () => {
                const currentUrl = encodeURIComponent(window.location.href);
                window.location.href = `login.html?redirect_to=${currentUrl}`;
            };
            return;
        }

        // -------------------------------------------------------------
        // 3. RECUPERATION DU PRODUIT
        // -------------------------------------------------------------
        console.log("Recherche du PriceID en base :", priceId);
        const { data: product, error } = await supabaseClient
            .from('store_products')
            .select('*')
            .eq('price_id', priceId)
            .single();

        if (error || !product) {
            console.error("Erreur Supabase Produit :", error);
            statusText.innerText = "Produit introuvable dans store_products.";
            btnProceed.innerText = "OUPS !!!";
            document.getElementById('visual-container').innerText = "Pas d'aperçu disponible";
            
            // Style Rouge Flamboyant d'erreur
            statusText.style.color = "#ff3333";
            statusText.style.fontSize = "1.5rem";
            statusText.style.fontWeight = "bold";
            statusText.style.textShadow = "0 0 10px rgba(255, 51, 51, 0.5)";
            return;
        }

        // Affichage du visuel produit
        document.getElementById('product-name').innerText = product.name || "Achat In-Game";
        document.getElementById('price-display').innerText = `ID: ${priceId}`;
        const visualUrl = product.image_url || "https://placeholder.com";
        
        if (product.animation_url) {
            document.getElementById('visual-container').innerHTML = `<video src="${product.animation_url}" autoplay loop muted></video>`;
        } else {
            document.getElementById('visual-container').innerHTML = `<img src="${visualUrl}" alt="Aperçu">`;
        }

        // Initialisation standard de Paddle
        Paddle.Environment.set(PADDLE_ENV);
        Paddle.Initialize({ token: PADDLE_CLIENT_TOKEN });

        btnProceed.disabled = false;
        statusText.innerText = `Connecté en tant que ${activeUser.display_name || activeUser.email}. Prêt pour le paiement.`;

        // -------------------------------------------------------------
        // 4. ACTION : TRAITEMENT DU CLIC DE PAIEMENT
        // -------------------------------------------------------------
        btnProceed.onclick = async () => {
            btnProceed.disabled = true;
            statusText.innerText = "Génération de la transaction Paddle...";

            try {
                // On passe l'user_id de l'application verrouillé ci-dessus
                const { data, error: funcError } = await supabaseClient.functions.invoke("create-checkout", {
                    body: { 
                        price_id: priceId,
                        game_slug: gameSlug || "default_game",
                        user_id: activeUser.id,
                        current_url: window.location.href
                    }
                });

                if (funcError) throw new Error(funcError.message || "Erreur Edge Function");
                if (!data || !data.transaction_id) throw new Error("Aucun identifiant de transaction reçu");

                // Nettoyage propre de l'URL uniquement après succès de l'appel backend
                if (currentToken) {
                    const cleanUrl = new URL(window.location.href);
                    cleanUrl.searchParams.delete('checkout_token');
                    window.history.replaceState({}, document.title, cleanUrl.toString());
                }

                Paddle.Checkout.open({
                    transactionId: data.transaction_id,
                    settings: {
                        displayMode: "overlay",
                        theme: "dark",
                        locale: "fr"
                    },
                    eventCallback: async function(event) {
                        if (event.name === "checkout.closed") {
                            console.log("Fenêtre fermée par l'utilisateur");
                            await supabaseClient
                                .from("payment_intents")
                                .update({ status: "abandoned" })
                                .eq("paddle_transaction_id", data.transaction_id)
                                .eq("status", "pending");
                        }
                    }
                });
                
                statusText.innerText = "Fenêtre de paiement ouverte.";
            } catch (err) {
                console.error("Erreur lors de la procédure :", err);
                alert("Erreur procédure : " + err.message);
                btnProceed.disabled = false;
                statusText.innerText = "❌ Échec de la création du checkout.";
                statusText.style.color = "#ff3333";
            }
        };
    }

    // Lancement automatique
    initCheckout();
</script>

</body>
</html>
