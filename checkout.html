<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Finalisez votre achat de contenu et jeux en toute sécurité sur aks6.ink.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
    <title>Finaliser l'achat - aks6.ink</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js" defer></script>
    <meta name="google-adsense-account" content="ca-pub-4741766423982776">
    <style>
        .checkout-box {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 6px;
            width: 100%;
            max-width: 480px;
            margin: 40px auto;
            text-align: center;
        }
        .game-visual {
            width: 100%;
            height: 240px;
            border-radius: 4px;
            margin-bottom: 20px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid #444;
        }
        .game-visual img, .game-visual video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="header_spacer"></div>
    <header class="primary_header">
        <a class="header_logo" href="index.html">aks6.ink</a>
        <div class="user_panel_widget">
            <a href="index.html" class="panel_button">Annuler et retourner au site</a>
        </div>
    </header>

    <main class="inner_column">
        <div class="checkout-box">
            <div id="visual-container" class="game-visual">
                <p style="color: var(--text-muted);">Chargement du visuel...</p>
            </div>

            <h1 id="product-name" style="font-size: 22px; margin-bottom: 8px;">Préparation de la commande...</h1>
            <div id="price-display" style="color: var(--text-muted); font-size: 13px; margin-bottom: 20px; font-family: monospace;">...</div>

            <button type="button" id="btn-proceed" class="button" style="width: 100%; font-size: 17px;" disabled>PROCÉDER AU PAIEMENT</button>
            <p id="status-text" style="margin-top: 15px; font-size: 14px; color: var(--text-muted);">Initialisation sécurisée...</p>
        </div>
    </main>

    <footer class="footer">
        <div class="footer_copy">
            © 2026 <strong>Sekhmetis</strong> - Tous droits réservés.
        </div>
        <div class="footer_links">
            <a href="legal_pages.html#confidentialite">Politique de Confidentialité</a>
            <a href="legal_pages.html#apropos">À Propos</a>
            <a href="legal_pages.html#contact">Contact</a>
        </div>
        <a href="#" onclick="if(window.googlefc) googlefc.showRevocationMessage(); return false;">Gestion des cookies</a>
    </footer>
    
    <script type="module">
		import { supabase } from './js/config.js';

		// Validation stricte des URLs médias pour parer les attaques XSS
		function safeMediaUrl(url) {
			if (!url || typeof url !== 'string') return null;
			const trimmed = url.trim();
			if (trimmed.startsWith('https://') || trimmed.startsWith('http://') || trimmed.startsWith('./') || trimmed.startsWith('/')) {
				return trimmed;
			}
			return null;
		}

		async function initCheckout() {
			const btnProceed = document.getElementById('btn-proceed');
			const statusText = document.getElementById('status-text');
			const visualContainer = document.getElementById('visual-container');

			// 1. Récupération des paramètres d'URL et du hash
			const urlParams = new URLSearchParams(window.location.search);
			const hashParams = new URLSearchParams(window.location.hash.startsWith('#') ? window.location.hash.substring(1) : window.location.hash);

			let priceId = urlParams.get('price_id');
			let gameSlug = urlParams.get('game');
			const currentToken = urlParams.get('checkout_token');

			// Identifiants de session transmis par le jeu
			const gameAccessToken = hashParams.get('access_token') || urlParams.get('access_token');
			const gameRefreshToken = hashParams.get('refresh_token') || urlParams.get('refresh_token');
			const gameUserId = hashParams.get('user_id') || urlParams.get('user_id');

			// Nettoyage immédiat de la barre d'adresse pour protéger les jetons
			if (window.location.hash.includes('access_token') || urlParams.has('access_token')) {
				const cleanUrl = new URL(window.location.href);
				cleanUrl.searchParams.delete('access_token');
				cleanUrl.searchParams.delete('refresh_token');
				cleanUrl.searchParams.delete('user_id');
				cleanUrl.hash = '';
				window.history.replaceState(null, '', cleanUrl.pathname + cleanUrl.search);
			}

			// 2. Gestion de la session Supabase (Connexion / Changement de compte)
			try {
				const { data: { session: existingSession } } = await supabase.auth.getSession();
				const existingUser = existingSession?.user;

				if (gameAccessToken && gameRefreshToken) {
					if (!existingUser) {
						statusText.innerText = "Synchronisation de votre session de jeu...";
						await supabase.auth.setSession({
							access_token: gameAccessToken,
							refresh_token: gameRefreshToken
						});
					} else if (existingUser.id === gameUserId) {
						console.log("Joueur identique déjà connecté sur le site.");
					} else {
						statusText.innerText = "Bascule vers le compte du jeu...";
						await supabase.auth.signOut({ scope: 'local' });
						await supabase.auth.setSession({
							access_token: gameAccessToken,
							refresh_token: gameRefreshToken
						});
					}
				}
			} catch (authSyncError) {
				console.warn("Erreur synchronisation auth :", authSyncError);
			}

			// 3. Récupération de l'utilisateur actif
			let activeUser = null;
			try {
				const { data: { user }, error: userError } = await supabase.auth.getUser();
				if (!userError && user) {
					activeUser = user;
				}
			} catch (e) {
				activeUser = null;
			}

			// 4. RÉCUPÉRATION DE LA COMMANDE (Exécutée systématiquement si currentToken existe)
			if (currentToken) {
				statusText.innerText = "Récupération de la commande...";
				const { data: sessionData, error: sessionErr } = await supabase
					.from('checkout_sessions')
					.select('*')
					.eq('token', currentToken)
					.gt('expires_at', new Date().toISOString())
					.maybeSingle();

				if (sessionData) {
					priceId = sessionData.price_id;
					gameSlug = sessionData.game_slug;
					if (!activeUser) {
						activeUser = { id: sessionData.user_id, email: sessionData.user_email };
					}
				} else {
					console.warn("Session introuvable ou expirée :", sessionErr);
				}
			}

			// Vérification de la connexion
			if (!activeUser) {
				statusText.innerText = "❌ Connexion requise pour finaliser l'achat.";
				btnProceed.disabled = false;
				btnProceed.innerText = "SE CONNECTER";
				btnProceed.onclick = () => {
					window.location.href = `login.html?redirect_to=${encodeURIComponent(window.location.href)}`;
				};
				return;
			}

			// Si le priceId n'est toujours pas trouvé
			if (!priceId) {
				statusText.innerText = "Référence du produit manquante dans la requête.";
				btnProceed.innerText = "INDISPONIBLE";
				return;
			}

			// 5. Récupération du produit dans store_products
			statusText.innerText = "Chargement des détails de l'article...";
			const { data: product, error: prodError } = await supabase
				.from('store_products')
				.select('*')
				.eq('price_id', priceId)
				.maybeSingle();

			if (prodError || !product) {
				console.error("Erreur store_products :", prodError, "Produit :", product);
				statusText.innerText = `Produit introuvable pour la référence : ${priceId}`;
				btnProceed.innerText = "INDISPONIBLE";
				return;
			}

			// Affichage textuel sécurisé (aucun innerHTML)
			document.getElementById('product-name').innerText = product.name || "Achat In-Game";
			document.getElementById('price-display').innerText = `Réf : ${priceId}`;

			// Rendu média 100% sécurisé via éléments DOM natifs
			const validVideo = safeMediaUrl(product.animation_url);
			const validImage = safeMediaUrl(product.image_url);

			if (validVideo) {
				const video = document.createElement('video');
				video.src = validVideo;
				video.autoplay = true;
				video.loop = true;
				video.muted = true;
				video.playsInline = true;
				visualContainer.replaceChildren(video);
			} else if (validImage) {
				const img = document.createElement('img');
				img.src = validImage;
				img.alt = product.name || "Aperçu du produit";
				visualContainer.replaceChildren(img);
			} else {
				const fallbackP = document.createElement('p');
				fallbackP.style.color = 'var(--text-muted)';
				fallbackP.innerText = 'Aucun visuel disponible';
				visualContainer.replaceChildren(fallbackP);
			}

			btnProceed.disabled = false;
			statusText.innerText = `Connecté en tant que ${activeUser.email || "Joueur"}. Prêt pour le règlement.`;

			// 6. Clic sur le bouton de paiement Paddle
			btnProceed.onclick = async () => {
				btnProceed.disabled = true;
				statusText.innerText = "Ouverture du terminal sécurisé...";

				try {
					const { data, error: funcError } = await supabase.functions.invoke("create-checkout", {
						body: { 
							price_id: priceId,
							game_slug: gameSlug || "default_game",
							checkout_token: currentToken,
							current_url: window.location.href
						}
					});

					if (funcError || !data?.transaction_id) {
						throw new Error(funcError?.message || data?.error || "Transaction non générée");
					}

					if (window.Paddle) {
						Paddle.Environment.set(data.paddle_environment);
						Paddle.Initialize({ token: data.paddle_client_token });

						Paddle.Checkout.open({
							transactionId: data.transaction_id,
							settings: {
								displayMode: "overlay",
								theme: "dark",
								locale: "fr"
							}
						});
						statusText.innerText = "Fenêtre de paiement ouverte.";
					}
				} catch (err) {
					console.error("Erreur Checkout:", err);
					alert("Erreur lors de l'ouverture du paiement : " + err.message);
					btnProceed.disabled = false;
					statusText.innerText = "❌ Échec de l'initialisation.";
				}
			};
		}

		window.addEventListener('DOMContentLoaded', initCheckout);
	</script>
