<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finaliser l'achat - Aks6</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <meta name="google-adsense-account" content="ca-pub-4741766423982776">
    <style>
        :root {
            --Aks6_white_back: #141414;
            --Aks6_gray_back: #1f1f1f;
            --Aks6_body_color: #e2e2e2;
            --Aks6_border_color: #333333;
            --Aks6_link_color: #fa5c5c;
        }
        body { 
            background-color: var(--Aks6_white_back); 
            color: var(--Aks6_body_color); 
            font-family: 'Lato', sans-serif; margin: 0; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
        }
        .checkout-container {
            background: var(--Aks6_gray_back);
            border: 1px solid var(--Aks6_border_color);
            padding: 30px; border-radius: 4px; width: 90%; max-width: 500px; text-align: center;
        }
        .game-visual {
            width: 100%; height: 250px; border-radius: 4px; margin-bottom: 20px;
            background: #000; display: flex; align-items: center; justify-content: center;
            overflow: hidden; border: 1px solid #444;
        }
        .game-visual img, .game-visual video { width: 100%; height: 100%; object-fit: cover; }
        
        h1 { font-size: 24px; margin-bottom: 10px; color: #fff; }
        .price-id { color: #888; font-size: 12px; margin-bottom: 20px; font-family: monospace; }
        
        .btn-pay {
            background-color: var(--Aks6_link_color);
            color: white; border: none; padding: 15px 30px;
            font-size: 18px; font-weight: bold; border-radius: 3px;
            cursor: pointer; width: 100%; transition: opacity 0.2s;
        }
        .btn-pay:disabled { background-color: #555; cursor: not-allowed; }
        .btn-pay:hover:not(:disabled) { opacity: 0.9; }
        
        .status-msg { margin-top: 15px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

    <div class="checkout-container">
        <div id="visual-container" class="game-visual">
            <!-- Image ou Animation chargée dynamiquement -->
            <p>Chargement du visuel...</p>
        </div>

        <h1 id="product-name">Préparation de la commande...</h1>
        <div id="price-display" class="price-id">...</div>

        <button id="btn-proceed" class="btn-pay" disabled>PROCÉDER AU PAIEMENT</button>
        <p id="status-text" class="status-msg">Initialisation sécurisée...</p>
    </div>
    <footer class="footer">
		<div style="margin-bottom: 10px; color: var(--Aks6_body_color);">
			© 2026 <strong>Sekhmetis</strong> - Tous droits réservés.
		</div>
		<div style="display: flex; justify-content: center; gap: 20px;">
			<a href="legal_pages.html#confidentialite" style="text-decoration: none; font-size: 12px;">Politique de Confidentialité</a>
			<a href="legal_pages.html#apropos" style="text-decoration: none; font-size: 12px;">À Propos</a>
			<a href="legal_pages.html#contact" style="text-decoration: none; font-size: 12px;">Contact</a>
		</div>
		<a href="#" onclick="googlefc.showRevocationMessage(); return false;" style="text-decoration: none; font-size: 12px;">Gestion des cookies</a>

    </footer>

   <script type="module">
    import { supabaseClient } from './js/config.js';
    
    async function initCheckout() {
        const urlParams = new URLSearchParams(window.location.search);
        const currentToken = urlParams.get('checkout_token');
        let priceId = urlParams.get('price_id');
        let gameSlug = urlParams.get('game');
        let activeUser = null;

        const btnProceed = document.getElementById('btn-proceed');
        const statusText = document.getElementById('status-text');

        // 1. VALIDATION DU CHECKOUT_TOKEN
        if (currentToken) {
            statusText.innerText = "Validation de la session en cours...";
            const { data: sessionData } = await supabaseClient
                .from('checkout_sessions')
                .select('*')
                .eq('token', currentToken)
                .gt('expires_at', new Date().toISOString())
                .maybeSingle();

            if (sessionData) {
                priceId = sessionData.price_id;
                gameSlug = sessionData.game_slug;
                activeUser = { id: sessionData.user_id, email: sessionData.user_email };
            }
        }

        // 2. CAS DE SECOURS : SESSION NAVIGATEUR
        if (!activeUser) {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) activeUser = user;
        }

        if (!activeUser) {
            statusText.innerText = "❌ Connexion requise pour finaliser l'achat.";
            btnProceed.disabled = false;
            btnProceed.innerText = "SE CONNECTER";
            btnProceed.onclick = () => {
                window.location.href = `login.html?redirect_to=${encodeURIComponent(window.location.href)}`;
            };
            return;
        }

        // 3. RECUPERATION DU PRODUIT
        const { data: product, error } = await supabaseClient
            .from('store_products')
            .select('*')
            .eq('price_id', priceId)
            .maybeSingle();

        if (error || !product) {
            statusText.innerText = "Produit introuvable pour ce price_id.";
            btnProceed.innerText = "INDISPONIBLE";
            return;
        }

        document.getElementById('product-name').innerText = product.name || "Achat In-Game";
        document.getElementById('price-display').innerText = `ID: ${priceId}`;

        if (product.animation_url) {
            document.getElementById('visual-container').innerHTML = `<video src="${product.animation_url}" autoplay loop muted></video>`;
        } else if (product.image_url) {
            document.getElementById('visual-container').innerHTML = `<img src="${product.image_url}" alt="Aperçu">`;
        }

        btnProceed.disabled = false;
        statusText.innerText = `Connecté. Prêt pour le paiement.`;

        // 4. CLIC PAIEMENT : INITIALISATION DYNAMIQUE DE PADDLE
        btnProceed.onclick = async () => {
            btnProceed.disabled = true;
            statusText.innerText = "Préparation du paiement sécurisé...";

            try {
                const { data, error: funcError } = await supabaseClient.functions.invoke("create-checkout", {
                    body: { 
                        price_id: priceId,
                        game_slug: gameSlug || "default_game",
                        checkout_token: currentToken,
                        current_url: window.location.href
                    }
                });

                if (funcError || !data?.transaction_id) {
                    throw new Error(funcError?.message || data?.error || "Transaction non générée");
                }

                // Initialisation dynamique de Paddle selon la réponse backend
                Paddle.Environment.set(data.paddle_environment);
                Paddle.Initialize({ token: data.paddle_client_token });

                Paddle.Checkout.open({
                    transactionId: data.transaction_id,
                    settings: {
                        displayMode: "overlay",
                        theme: "dark",
                        locale: "fr"
                    }
                });

                statusText.innerText = "Fenêtre de paiement ouverte.";
            } catch (err) {
                console.error("Erreur Checkout:", err);
                alert("Erreur lors de l'ouverture du paiement : " + err.message);
                btnProceed.disabled = false;
                statusText.innerText = "❌ Échec de la création du paiement.";
            }
        };
    }

    initCheckout();
</script>

</body>
</html>
