<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Créez votre compte joueur gratuit sur aks6.ink et accédez à tous nos jeux vidéo indépendants.">
    <!--<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">-->
    <link rel="stylesheet" href="main.css">
    <title>S'inscrire - aks6.ink</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4" defer></script>
    <meta name="google-adsense-account" content="ca-pub-4741766423982776">
</head>
<body>
    <div class="header_spacer"></div>
    <header class="primary_header">
        <a class="header_logo" href="index.html">aks6.ink</a>
        <div class="header_buttons">
            <a class="header_button" href="browse.html">Parcourir</a>
        </div>
        <div class="user_panel_widget">
            <a href="login.html" class="panel_button">Connexion</a>
        </div>
    </header>

    <main class="inner_column compressed_column">
        <div class="base_widget">
            <h1 style="margin-top: 0; font-size: 22px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;">Créer un compte</h1>
            
            <p id="error-msg" style="color: var(--accent-light); background: rgba(201, 42, 42, 0.15); padding: 10px; border-radius: 4px; display: none; margin-bottom: 15px; font-size: 14px;"></p>

            <form id="registerForm">
                <div class="input_row">
					<label for="username">Nom d'utilisateur</label>
					<input type="text" id="username" name="username" autocomplete="username" required placeholder="Ex: PseudoGamer">
				</div>
				<div class="input_row">
					<label for="email">Adresse Email</label>
					<input type="email" id="email" name="email" autocomplete="email" required placeholder="nom@exemple.com">
				</div>
				<div class="input_row">
					<label for="password">Mot de passe (6 caractères min.)</label>
					<input type="password" id="password" name="password" autocomplete="new-password" required minlength="6" placeholder="••••••••">
				</div>
                <button type="submit" id="submit-btn" class="button" style="width: 100%;">Créer mon compte</button>
            </form>

            <div style="text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted);">
                Déjà un compte ? <a href="login.html" style="color: var(--accent-light); text-decoration: none;">Se connecter</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer_copy">
            © 2026 <strong>Sekhmetis</strong> - Tous droits réservés.
        </div>
        <div class="footer_links">
            <a href="legal_pages.html#confidentialite">Politique de Confidentialité</a>
            <a href="legal_pages.html#apropos">À Propos</a>
            <a href="legal_pages.html#contact">Contact</a>
        </div>
        <a href="#" onclick="if(window.googlefc) googlefc.showRevocationMessage(); return false;">Gestion des cookies</a>
    </footer>

    <script type="module">
		import { supabase } from './js/config.js';

		const form = document.getElementById('registerForm');
		const errorMsg = document.getElementById('error-msg');
		const submitBtn = document.getElementById('submit-btn');

		form.onsubmit = async (e) => {
			e.preventDefault();
			submitBtn.disabled = true;
			submitBtn.innerText = "Création en cours...";
			errorMsg.style.display = 'none';

			const email = document.getElementById('email').value.trim();
			const password = document.getElementById('password').value;
			const username = document.getElementById('username').value.trim();

			const { error } = await supabase.auth.signUp({
				email,
				password,
				options: { 
					data: { display_name: username } 
				}
			});

			if (error) {
				errorMsg.innerText = error.message;
				errorMsg.style.display = 'block';
				submitBtn.disabled = false;
				submitBtn.innerText = "Créer mon compte";
			} else {
				alert("Compte créé avec succès ! Vous pouvez maintenant vous connecter.");
				window.location.href = "login.html";
			}
		};
	</script>
</body>
</html>
