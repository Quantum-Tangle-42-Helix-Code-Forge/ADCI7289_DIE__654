<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Authentification du Jeu - aks6.ink</title>
    <script src="https://jsdelivr.net"></script>
    <meta name="google-adsense-account" content="ca-pub-4741766423982776">
     <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="background:#141414; color:white; font-family:sans-serif; text-align:center; padding-top:100px;">
    <h2>Connexion à votre jeu en cours...</h2>
    <p id="status">Vérification de la session Supabase...</p>
    <footer class="footer">
		<div style="margin-bottom: 10px; color: var(--Aks6_body_color);">
			© 2026 <strong>Sekhmetis</strong> - Tous droits réservés.
		</div>
		<div style="display: flex; justify-content: center; gap: 20px;">
			<a href="legal_pages.html#confidentialite" style="text-decoration: none; font-size: 12px;">Politique de Confidentialité</a>
			<a href="legal_pages.html#apropos" style="text-decoration: none; font-size: 12px;">À Propos</a>
			<a href="legal_pages.html#contact" style="text-decoration: none; font-size: 12px;">Contact</a>
		</div>
		<a href="#" onclick="googlefc.showRevocationMessage(); return false;" style="text-decoration: none; font-size: 12px;">Gestion des cookies</a>
    </footer>

    <script type="module">
		import { supabase } from './js/config.js';

		async function checkAuthAndRedirect() {
			const statusJson = document.getElementById('status');
			
			// Récupérer la session actuelle du navigateur
			const { data: { session }, error } = await supabase.auth.getSession();

			if (error || !session) {
				statusJson.innerText = "Non connecté. Redirection vers la page de connexion...";
				window.location.href = "login.html?redirect_to=game-auth.html";
				return;
			}

			const token = session.access_token;
			const userId = session.user.id;

			statusJson.innerText = "Session trouvée ! Redirection vers le jeu...";

			// Envoi des données vers le jeu via Deep Link
			window.location.href = `aks6-game://auth?token=${token}&id=${userId}`;

			setTimeout(() => {
				statusJson.innerText = "Vous pouvez fermer cette fenêtre et retourner sur votre jeu.";
			}, 2000);
		}

		window.addEventListener('DOMContentLoaded', checkAuthAndRedirect);
	</script>
</body>
</html>
