<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Jouez aux meilleurs jeux vidéo indépendants en ligne gratuitement sur aks6.ink. Découvrez notre catalogue de jeux d'arcade, puzzles et aventures.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
    <title>aks6.ink - Plateforme de Jeux Vidéo Indépendants</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4" defer></script>
    <meta name="google-adsense-account" content="ca-pub-4741766423982776">
</head>
<body>
    <div class="header_spacer"></div>
    <header class="primary_header">
        <a class="header_logo" href="index.html">aks6.ink</a>
        <div class="header_buttons">
            <a class="header_button" href="browse.html">Parcourir</a>
        </div>
        
        <form action="browse.html" method="GET" class="game_search" role="search">
            <input type="text" name="q" class="search_input" placeholder="Rechercher titre, genre..." aria-label="Rechercher des jeux">
        </form>

        <div class="user_panel_widget" id="user-panel">
            <a href="login.html" class="panel_button">Connexion</a>
            <a href="register.html" class="panel_button register_button">S'inscrire</a>
        </div>
    </header>

    <main class="inner_column">
        <div style="padding: 15px 0;">
            <h1 style="font-size: 26px; margin: 0;">
                Derniers Jeux Vidéo
                <span id="game-count" style="font-size: 16px; font-weight: normal; color: var(--text-muted);"></span>
            </h1>
        </div>

        <div id="game-grid" class="game_grid_widget">
            <!-- Skeleton de réservation pour éliminer le CLS -->
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer_copy">
            © 2026 <strong>Sekhmetis</strong> - Tous droits réservés.
        </div>
        <div class="footer_links">
            <a href="legal_pages.html#confidentialite">Politique de Confidentialité</a>
            <a href="legal_pages.html#apropos">À Propos</a>
            <a href="legal_pages.html#contact">Contact</a>
        </div>
        <a href="#" onclick="if(window.googlefc) googlefc.showRevocationMessage(); return false;">Gestion des cookies</a>
    </footer>

    <script type="module">
		import { supabase } from './js/config.js';

		// Protection XSS
		function escapeHtml(str) {
			if (!str) return '';
			return String(str)
				.replace(/&/g, '&amp;')
				.replace(/</g, '&lt;')
				.replace(/>/g, '&gt;')
				.replace(/"/g, '&quot;')
				.replace(/'/g, '&#039;');
		}

		// Validation des URLs de médias
		function safeMediaUrl(url) {
			if (!url || typeof url !== 'string') return '';
			if (url.startsWith('https://') || url.startsWith('http://') || url.startsWith('./')) {
				return url;
			}
			return '';
		}

		// Optimisation Cloudinary (320px pour supprimer la pénalité mobile de Lighthouse)
		function optimizeCloudinary(url, width = 320) {
			if (!url || typeof url !== 'string') return '';
			if (!url.includes('cloudinary.com') || url.includes('/f_auto')) return url;
			return url.replace('/upload/', `/upload/f_auto,q_auto,w_${width}/`);
		}

		async function init() {
			const grid = document.getElementById('game-grid');
			const panel = document.getElementById('user-panel');

			// 1. Détection locale instantanée (0 ms) : vérifie si un jeton existe sans appel réseau
			const hasLocalToken = Object.keys(localStorage).some(key => key.startsWith('sb-') && key.endsWith('-auth-token'));

			let isAdmin = false;
			let currentUser = null;

			// Seul un utilisateur possédant un jeton local déclenche les vérifications de session
			if (hasLocalToken) {
				const { data: { user } } = await supabase.auth.getUser();
				if (user) {
					currentUser = user;
					const { data: adminData } = await supabase
						.from('admins')
						.select('user_id')
						.eq('user_id', user.id)
						.maybeSingle();

					isAdmin = adminData !== null;
				}
			}

			// 2. Mise à jour sécurisée du header si connecté
			if (currentUser && panel) {
				const safeDisplayName = escapeHtml(currentUser.user_metadata?.display_name || 'Compte');
				panel.innerHTML = `
					<a href="user_account.html" class="panel_button">${safeDisplayName}</a>
					${isAdmin ? '<a href="upload.html" class="panel_button" style="color:var(--accent-light); border-color:var(--accent-light);">Ajouter</a>' : ''}
					<button type="button" id="logout-btn" class="panel_button">Déconnexion</button>
				`;

				document.getElementById('logout-btn').onclick = async () => {
					await supabase.auth.signOut({ scope: 'local' });
					window.location.reload();
				};
			}

			// 3. Requête directe des jeux appropriés (aucun décalage pour les visiteurs)
			const { data: games, error } = await supabase
				.from('games')
				.select('*')
				.eq('is_test', isAdmin)
				.order('created_at', { ascending: false });

			if (error || !games) {
				grid.innerHTML = "<p style='color:var(--text-muted);'>Erreur lors du chargement des jeux.</p>";
				return;
			}

			document.getElementById('game-count').innerText = ` (${games.length})`;

			if (games.length === 0) {
				const emptyMsg = isAdmin 
					? "Aucun jeu en phase de test pour le moment." 
					: "Aucun jeu disponible pour le moment.";
				grid.innerHTML = `<p style='grid-column: 1/-1; text-align: center; color: var(--text-muted);'>${emptyMsg}</p>`;
				return;
			}

			// 4. Rendu de la grille (seule la 1ère image a fetchpriority="high" pour le LCP)
			grid.innerHTML = games.map((game, index) => {
				let loadingAttributes = (index === 0) ? 'fetchpriority="high"' : (index < 3 ? '' : 'loading="lazy"');

				const safeTitle = escapeHtml(game.title);
				const safeSlug = encodeURIComponent(game.slug);
				const safeShort = escapeHtml(game.short_text || '');
				const safeImg = escapeHtml(optimizeCloudinary(safeMediaUrl(game.cover_image), 320));
				const safePrice = Number(game.price) || 0;

				return `
					<article class="game_cell">
						<div class="bordered">
							<a href="game.html?slug=${safeSlug}" aria-label="Jouer à ${safeTitle}">
								<img src="${safeImg}" 
									 alt="Aperçu du jeu ${safeTitle}" 
									 width="315" height="200" 
									 ${loadingAttributes}>
							</a>
						</div>
						<div class="label">
							<span class="price_tag">${safePrice === 0 ? 'Gratuit' : safePrice + ' $'}</span>
							<a class="title" href="game.html?slug=${safeSlug}">${safeTitle}</a>
							<div class="sub">${safeShort}</div>
						</div>
					</article>
				`;
			}).join('');
		}

		window.addEventListener('DOMContentLoaded', init);
	</script>

		window.addEventListener('DOMContentLoaded', init);
	</script>
</body>
</html>
