<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Jouez directement en ligne sur aks6.ink.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
    <title>aks6.ink - Détails du Jeu</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <style>
        .game_hero {
            width: 100%;
            height: 380px;
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 20px 0;
            overflow: hidden;
        }
        .game_hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(4px);
        }
        .hero_content { position: relative; z-index: 1; text-align: center; }
        .play_btn_large {
            font-size: 20px;
            padding: 16px 40px;
            min-height: 54px;
        }
    </style>
</head>
<body>
    <div class="header_spacer"></div>
    <header class="primary_header">
        <a class="header_logo" href="index.html">aks6.ink</a>
        <div class="header_buttons">
            <a class="header_button" href="browse.html">Parcourir</a>
        </div>
        <form action="browse.html" method="GET" class="game_search" role="search">
            <input type="text" name="q" class="search_input" placeholder="Rechercher titre, genre..." aria-label="Rechercher des jeux">
        </form>
        <div class="user_panel_widget">
            <a href="index.html" class="panel_button">Accueil</a>
        </div>
    </header>

    <main class="inner_column">
        <div id="game-info">
            <h1 id="game-title" style="margin: 0;">Chargement...</h1>
            <div id="game-hero" class="game_hero">
                <div class="hero_content">
                    <a id="play-link" href="#" class="button play_btn_large">LANCER LE JEU</a>
                </div>
            </div>

            <div class="base_widget">
                <h2 style="font-size: 18px; margin-top: 0;">À propos de ce jeu</h2>
                <p id="game-desc" style="line-height: 1.6; color: var(--text-muted); margin: 0;"></p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer_copy">
            © 2026 <strong>Sekhmetis</strong> - Tous droits réservés.
        </div>
        <div class="footer_links">
            <a href="legal_pages.html#confidentialite">Politique de Confidentialité</a>
            <a href="legal_pages.html#apropos">À Propos</a>
            <a href="legal_pages.html#contact">Contact</a>
        </div>
        <a href="#" onclick="if(window.googlefc) googlefc.showRevocationMessage(); return false;">Gestion des cookies</a>
    </footer>

    <script type="module">
        import { SUPABASE_URL, SUPABASE_KEY } from './js/config.js';

        function getSupabase() {
            return new Promise(resolve => {
                const check = () => {
                    if (window.supabase) resolve(window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY));
                    else setTimeout(check, 50);
                };
                check();
            });
        }

        async function loadGame() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');
            if(!slug) { window.location.href = "index.html"; return; }

            const supabase = await getSupabase();
            const { data: game, error } = await supabase.from('games').select('*').eq('slug', slug).single();
            
            if(error || !game) {
                document.getElementById('game-title').innerText = "Jeu non trouvé";
                document.getElementById('game-hero').style.display = 'none';
                return;
            }

            document.title = game.title + " - aks6.ink";
            document.getElementById('game-title').innerText = game.title;
            document.getElementById('game-desc').innerText = game.description;
            document.getElementById('game-hero').style.backgroundImage = `url('${game.cover_image}')`;
            document.getElementById('play-link').href = `./games/${game.slug}/`;
        }

        window.addEventListener('DOMContentLoaded', loadGame);
    </script>
</body>
</html>
