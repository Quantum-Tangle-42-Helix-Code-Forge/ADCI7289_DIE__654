<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Ajoutez un nouveau jeu vidéo indépendant sur la plateforme aks6.ink.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
    <title>Ajouter un projet - aks6.ink</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <meta name="google-adsense-account" content="ca-pub-4741766423982776">
</head>
<body>
    <div class="header_spacer"></div>
    <header class="primary_header">
        <a class="header_logo" href="index.html">aks6.ink</a>
        <div class="header_buttons">
            <a class="header_button" href="browse.html">Parcourir</a>
        </div>
        <div class="user_panel_widget">
            <a href="user_account.html" class="panel_button">Mon Tableau de bord</a>
        </div>
    </header>

    <main class="inner_column" style="max-width: 900px;">
        <div class="base_widget">
            <h1 style="color: var(--accent-light); margin-top: 0; font-size: 24px;">🚀 Lier un nouveau projet</h1>
            
            <form id="uploadForm">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
                    <div>
                        <div class="input_row">
                            <label for="title">Titre du jeu</label>
                            <input type="text" id="title" required placeholder="Ex: Mon Super Jeu">
                        </div>
                        <div class="input_row">
                            <label for="slug">Slug (nom du dossier dans /games/)</label>
                            <input type="text" id="slug" required placeholder="mon-super-jeu">
                        </div>
                        <div class="input_row">
                            <label for="short_text">Accroche courte</label>
                            <input type="text" id="short_text" placeholder="Action, RPG, WebGL...">
                        </div>
                        <div class="input_row">
                            <label for="is_test" style="color: var(--accent-light);">Statut de publication</label>
                            <select id="is_test" style="border-color: var(--accent-light);">
                                <option value="true" selected>🧪 Phase de test (Admins uniquement)</option>
                                <option value="false">🚀 En ligne (Public)</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <div class="input_row">
                            <label for="genre">Genre</label>
                            <select id="genre">
                                <option value="Action">Action</option>
                                <option value="Aventure">Aventure</option>
                                <option value="RPG">RPG</option>
                                <option value="Puzzle">Puzzle</option>
                                <option value="Plateforme">Plateforme</option>
                                <option value="Autre">Autre</option>
                            </select>
                        </div>
                        <div class="input_row">
                            <label for="coverFile">Image de couverture</label>
                            <input type="file" id="coverFile" accept="image/*" required>
                        </div>
                        <div class="input_row">
                            <label for="price">Prix ($)</label>
                            <input type="number" id="price" value="0.00" step="0.01">
                        </div>
                        <div class="input_row">
                            <label for="description">Description</label>
                            <textarea id="description" style="height: 100px; resize: vertical;"></textarea>
                        </div>
                    </div>
                </div>
                <button type="submit" id="btn" class="button" style="width: 100%; margin-top: 15px; font-size: 16px;">ENREGISTRER LE JEU</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="footer_copy">
            © 2026 <strong>Sekhmetis</strong> - Tous droits réservés.
        </div>
        <div class="footer_links">
            <a href="legal_pages.html#confidentialite">Politique de Confidentialité</a>
            <a href="legal_pages.html#apropos">À Propos</a>
            <a href="legal_pages.html#contact">Contact</a>
        </div>
        <a href="#" onclick="if(window.googlefc) googlefc.showRevocationMessage(); return false;">Gestion des cookies</a>
    </footer>

    <script type="module">
		import { supabase, CLOUDINARY_URL, CLOUDINARY_PRESET } from './js/config.js';

		async function checkAdminAccess() {
			const { data: { user } } = await supabase.auth.getUser();
			if (!user) {
				window.location.href = "login.html";
				return;
			}

			const { data: adminData, error } = await supabase
				.from('admins')
				.select('user_id')
				.eq('user_id', user.id)
				.maybeSingle();

			if (error || !adminData) {
				alert("Accès refusé : vous n'êtes pas administrateur.");
				window.location.href = "index.html";
			}
		}
		
		window.addEventListener('DOMContentLoaded', checkAdminAccess);

		document.getElementById('uploadForm').onsubmit = async (e) => {
			e.preventDefault();
			const btn = document.getElementById('btn');
			btn.disabled = true;
			btn.innerText = "Téléversement en cours...";

			try {
				// Téléversement vers Cloudinary
				const file = document.getElementById('coverFile').files[0];
				const formData = new FormData();
				formData.append('file', file);
				formData.append('upload_preset', CLOUDINARY_PRESET);

				const res = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData });
				const json = await res.json();
				if (!json.secure_url) throw new Error("Échec du téléversement de l'image");

				// Données vers Supabase
				const isTestValue = document.getElementById('is_test').value === 'true';

				const { error } = await supabase.from('games').insert([{
					title: document.getElementById('title').value,
					slug: document.getElementById('slug').value.toLowerCase().trim().replace(/\s+/g, '-'),
					description: document.getElementById('description').value,
					short_text: document.getElementById('short_text').value,
					genre: document.getElementById('genre').value,
					price: parseFloat(document.getElementById('price').value),
					cover_image: json.secure_url,
					is_test: isTestValue
				}]);

				if (error) throw error;
				alert("Jeu enregistré avec succès !");
				window.location.href = "index.html";
			} catch (err) {
				alert("Erreur : " + err.message);
				btn.disabled = false;
				btn.innerText = "ENREGISTRER LE JEU";
			}
		};
	</script>
</body>
</html>
