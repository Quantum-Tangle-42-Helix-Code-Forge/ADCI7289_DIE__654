<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Parcourez notre catalogue complet de jeux vidéo en ligne sur aks6.ink : action, aventure, puzzle, et jeux rétro.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
    <title>Parcourir les jeux - aks6.ink</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4" defer></script>
</head>
<body>
    <div class="header_spacer"></div>
    <header class="primary_header">
        <a class="header_logo" href="index.html">aks6.ink</a>
        <div class="header_buttons">
            <a class="header_button" href="browse.html" style="color:white;">Parcourir</a>
        </div>
        <div class="user_panel_widget">
            <a href="index.html" class="panel_button">Accueil</a>
        </div>
    </header>

    <main class="inner_column">
        <div class="base_widget" style="margin-bottom: 25px;">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
                <div>
                    <label for="universal-search">Recherche par titre, tag</label>
                    <input type="text" id="universal-search" placeholder="Ex: Tetris, Action...">
                </div>
                <div>
                    <label for="genre-select">Filtrer par Genre</label>
                    <select id="genre-select">
                        <option value="">Tous les genres</option>
                        <option value="Action">Action</option>
                        <option value="Aventure">Aventure</option>
                        <option value="RPG">RPG</option>
                        <option value="Puzzle">Puzzle</option>
                        <option value="Plateforme">Plateforme</option>
                        <option value="Autre">Autre</option>
                    </select>
                </div>
            </div>
        </div>

        <h1 id="result-title" style="font-size: 24px; margin-bottom: 16px;">Tous les jeux</h1>
        
        <div id="game-grid" class="game_grid_widget">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer_copy">
            © 2026 <strong>Sekhmetis</strong> - Tous droits réservés.
        </div>
        <div class="footer_links">
            <a href="legal_pages.html#confidentialite">Politique de Confidentialité</a>
            <a href="legal_pages.html#apropos">À Propos</a>
            <a href="legal_pages.html#contact">Contact</a>
        </div>
        <a href="#" onclick="if(window.googlefc) googlefc.showRevocationMessage(); return false;">Gestion des cookies</a>
    </footer>

	<script type="module">
		import { supabase } from './js/config.js';

		// Protection XSS
		function escapeHtml(str) {
			if (!str) return '';
			return String(str)
				.replace(/&/g, '&amp;')
				.replace(/</g, '&lt;')
				.replace(/>/g, '&gt;')
				.replace(/"/g, '&quot;')
				.replace(/'/g, '&#039;');
		}

		// Validation des URLs de médias
		function safeMediaUrl(url) {
			if (!url || typeof url !== 'string') return '';
			if (url.startsWith('https://') || url.startsWith('http://') || url.startsWith('./')) {
				return url;
			}
			return '';
		}

		// Optimisation Cloudinary (320px)
		function optimizeCloudinary(url, width = 320) {
			if (!url || typeof url !== 'string') return '';
			if (!url.includes('cloudinary.com') || url.includes('/f_auto')) return url;
			return url.replace('/upload/', `/upload/f_auto,q_auto,w_${width}/`);
		}

		async function init() {
			const searchInput = document.getElementById('universal-search');
			const genreSelect = document.getElementById('genre-select');
			const grid = document.getElementById('game-grid');
			const resultTitle = document.getElementById('result-title');

			const urlParams = new URLSearchParams(window.location.search);
			const queryFromHeader = urlParams.get('q');
			if (queryFromHeader) searchInput.value = queryFromHeader;

			// 1. Détection locale instantanée (0 ms)
			const hasLocalToken = Object.keys(localStorage).some(key => key.startsWith('sb-') && key.endsWith('-auth-token'));

			let isAdmin = false;
			if (hasLocalToken) {
				const { data: { user } } = await supabase.auth.getUser();
				if (user) {
					const { data: adminData } = await supabase
						.from('admins')
						.select('user_id')
						.eq('user_id', user.id)
						.maybeSingle();
					isAdmin = adminData !== null;
				}
			}

			// 2. Recherche et filtrage
			async function updateSearch() {
				const text = searchInput.value.trim();
				const genre = genreSelect.value;

				let dbQuery = supabase
					.from('games')
					.select('*')
					.eq('is_test', isAdmin);

				if (text) {
					dbQuery = dbQuery.or(`title.ilike.%${text}%,short_text.ilike.%${text}%,genre.ilike.%${text}%`);
					resultTitle.innerText = `Résultats pour "${text}"`;
				} else {
					resultTitle.innerText = isAdmin ? "🧪 Tous les jeux en test (Admin)" : "Tous les jeux";
				}

				if (genre) dbQuery = dbQuery.eq('genre', genre);

				const { data: games, error } = await dbQuery.order('created_at', { ascending: false });

				if (error || !games || games.length === 0) {
					grid.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: var(--text-muted);'>Aucun jeu ne correspond à votre recherche.</p>";
					return;
				}

				// 3. Rendu de la grille
				grid.innerHTML = games.map((game, index) => {
					let loadingAttributes = (index === 0) ? 'fetchpriority="high"' : (index < 3 ? '' : 'loading="lazy"');

					const safeTitle = escapeHtml(game.title);
					const safeSlug = encodeURIComponent(game.slug);
					const safeShort = escapeHtml(game.short_text || '');
					const safeImg = escapeHtml(optimizeCloudinary(safeMediaUrl(game.cover_image), 320));
					const safePrice = Number(game.price) || 0;

					return `
						<article class="game_cell">
							<div class="bordered">
								<a href="game.html?slug=${safeSlug}" aria-label="Jouer à ${safeTitle}">
									<img src="${safeImg}" 
										 alt="Aperçu du jeu ${safeTitle}" 
										 width="315" height="200" 
										 ${loadingAttributes}>
								</a>
							</div>
							<div class="label">
								<span class="price_tag">${safePrice === 0 ? 'Gratuit' : safePrice + ' $'}</span>
								<a class="title" href="game.html?slug=${safeSlug}">${safeTitle}</a>
								<div class="sub">${safeShort}</div>
							</div>
						</article>
					`;
				}).join('');
			}

			searchInput.addEventListener('input', updateSearch);
			genreSelect.addEventListener('change', updateSearch);
			updateSearch();
		}

		window.addEventListener('DOMContentLoaded', init);
	</script>
</body>
</html>
